    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Anti-Flash Script for Theme -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            // Note: Light mode is default per requirements unless user/system specifically requests dark
            // But requirement states:
            // 1. User-selected theme
            // 2. Saved theme
            // 3. System preference
            // 4. Light mode fallback
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-ivory-50 text-charcoal-800 dark:bg-charcoal-900 dark:text-ivory-100 transition-colors duration-300 antialiased selection:bg-champagne-300 selection:text-charcoal-900">
